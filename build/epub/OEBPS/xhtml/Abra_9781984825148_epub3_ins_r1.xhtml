	<body>
		<a id="d2-d2s0"/>
		<div>
			<span epub:type="pagebreak" id="page_Insert_1" role="doc-pagebreak" title="Insert_1"/>
			<figure class="figure">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_1_img1" src="../images/001_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(UPI/BETTMANN ARCHIVE VIA GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">The construction of the Cross Bronx Expressway began in 1948, displacing nearby African American and Puerto Rican communities. The borough’s bifurcation cemented the economic disparity between the North and South Bronx.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_79">
					<img alt="" class="fill" id="page_Insert_1_img2" src="../images/003_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold">(AL PEREIRA/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">1520 Sedgwick Avenue in the Bronx, where DJ Kool Herc threw parties in the apartment complex’s community room in the 1970s. The site is recognized as hip-hop’s birthplace.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_1_img3" src="../images/002_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JEROME LIEBLING/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Early MCs found inspiration amid the desolation and decay of the South Bronx, seen here in 1977. “We were creating something that took up our time and made us feel good and brought us together,” said Easy A.D. of the Cold Crush Brothers. “You have to imagine walking out your house every day and seeing abandoned cars burnt up, empty buildings, and you’re going to elementary school.”</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_2" role="doc-pagebreak" title="Insert_2"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_2_img1" src="../images/004_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(PYMCA/UNIVERSAL IMAGES GROUP VIA GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">B-boys and b-girls sought out parties featuring pioneering hip-hop DJs, where they would perform acrobatic dance moves during the music’s breakbeats.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_2_img2" src="../images/005_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(DAVID CORIO/MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Kurtis Blow (left) attended some of hip-hop’s earliest jams in the Bronx, which often were presided over by DJ Kool Herc (right), widely credited with originating the genre by isolating and prolonging breakbeats.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_2_img3" src="../images/006_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(DAVID CORIO/MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Grandmaster Flash helped shape DJing into artistry. His “quick mix” theory served as a backbone for hip-hop music.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_3" role="doc-pagebreak" title="Insert_3"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_3_img1" src="../images/007_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(AL PEREIRA/GETTY IMAGES/MICHAEL OCHS ARCHIVES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">The Cold Crush Brothers (left to right: DJ Charlie Chase, Grandmaster Caz, Almighty Kay Gee, Easy A.D.) had the foresight to record and photograph their performances, providing some of hip-hop’s earliest documentation. Before the group formed, DJ Charlie Chase was a pioneering turntablist and Grandmaster Caz served as a trailblazing lyricist, whose words were used in “Rapper’s Delight.”</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_3_img2" src="../images/008_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">“I said a hip-hop, the hippie, the hippie / To the hip, hip-hop and you don’t stop the rockin’.” The Sugarhill Gang (left to right: Wonder Mike, Master G, Big Bank Hank) introduced hip-hop’s first commercial hit song with 1979’s “Rapper’s Delight.”</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_3_img3" src="../images/009_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(LAURA LEVINE/CORBIS VIA GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">The Funky 4 + 1 included pioneering female MC Sha-Rock (center) and broke ground by appearing on <i>Saturday Night Live</i> in 1981.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_4" role="doc-pagebreak" title="Insert_4"/>
			<figure class="figure figure_full_caption">
				<div class="width_68">
					<img alt="" class="fill" id="page_Insert_4_img1" src="../images/010_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Run-DMC established hip-hop’s crossover appeal in the 1980s. The group’s groundbreaking deal with Adidas was the first sponsorship between a hip-hop group and a sports apparel company, and an early hint of the genre’s mass potential for commercialization.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_5" role="doc-pagebreak" title="Insert_5"/>
			<figure class="figure figure_full_caption">
				<div class="width_83">
					<img alt="" class="fill" id="page_Insert_5_img1" src="../images/011_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JANETTE BECKMAN/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Rick Rubin (back, left) and the Beastie Boys (back: MCA and Ad-Rock; front: Mike D) were New York punk rockers turned hip-hoppers. Rubin produced the Beasties’ 1986 debut, <i>Licensed to Ill</i>, the first hip-hop album to top the Billboard album chart.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_79">
					<img alt="" class="fill" id="page_Insert_5_img2" src="../images/012_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(AL PEREIRA/GETTY IMAGES/MICHAEL OCHS ARCHIVES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">DJ Marley Marl transformed hip-hop in the 1980s by discovering how to sample pieces of songs into a drum machine using a sampling keyboard, and served as a leading figure in the Juice Crew collective.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_6" role="doc-pagebreak" title="Insert_6"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_6_img1" src="../images/013_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(ALLEN BEREZOVSKY/WIREIMAGE)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">In Los Angeles, DJ Greg Mack transitioned the radio station KDAY 1580-AM into an early outlet for hip-hop, helping to break out nearly every major West Coast artist who emerged in the 1980s.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_6_img2" src="../images/014_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(DAVID CORIO/MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Philadelphia’s Pop Art Records released Roxanne Shanté’s “Roxanne’s Revenge” in 1984. The song spawned countless response records and established Shanté as one of hip-hop’s first female breakout stars.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_6_img3" src="../images/015_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(DAVID CORIO/REDFERNS)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">MC Shan was one of the earliest hip-hop artists hailing from Queensbridge, the public housing development that also produced Roxanne Shanté, Cormega, Nas, Mobb Deep’s Havoc, and many others.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_6_img4" src="../images/016_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(RAYMOND BOYD/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">For many, Rakim, with his effortless flow and intricate rhyme patterns, sits atop the list of best rappers, followed by every other artist to touch a microphone.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_7" role="doc-pagebreak" title="Insert_7"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_7_img1" src="../images/017_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(FRANK MICELOTTA/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">The debut of <i>Yo! MTV Raps</i> in the late 1980s brought the genre to TV screens beyond America’s major markets. Ed Lover (left) and Doctor Dré (right), shown with producer Ted Demme, hosted the show’s weekday version.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_93">
					<img alt="" class="fill" id="page_Insert_7_img2" src="../images/018_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JANETTE BECKMAN/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Philadelphia’s Schoolly D released “P.S.K. What Does It Mean?” in 1985. The classic track laid a blueprint for gangster rap that Ice-T and N.W.A soon followed.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_7_img3" src="../images/019_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(AL PEREIRA/GETTY IMAGES/MICHAEL OCHS ARCHIVES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Monie Love (left) and Queen Latifah (right) performing “Ladies First” at Newark Symphony Hall in April 1990. “We knew we wanted to do a song that was uplifting for women, but we didn’t realize we were writing a song that other women would identify themselves,” Love recalled.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_8" role="doc-pagebreak" title="Insert_8"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_8_img1" src="../images/020_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(RAYMOND BOYD/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Ice-T (left) and Kool Moe Dee (right) secured their reputations as influential MCs during hip-hop’s transformational golden age. Both also dealt with controversy. Kool Moe Dee did not follow other hip-hop acts in boycotting the 1989 Grammy Awards, while Ice-T’s heavy metal band dropped “Cop Killer,” a song that provoked negative reactions from law enforcement advocates and politicians.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_8_img2" src="../images/021_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JACK MITCHELL/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Long Island’s Public Enemy redefined hip-hop as a vessel for stirring consciousness and awakening minds. The group was marked by the impactful voice of Chuck D, Flavor Flav’s energetic delivery as a hype man, and the powerful sonic backing of the Bomb Squad.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_9" role="doc-pagebreak" title="Insert_9"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_9_img1" src="../images/022_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(DAVID REDFERN/REDFERNS)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Salt-N-Pepa changed the prototypical image of an MC in the 1980s through sex-positive tracks and brash personalities, while becoming the first female hip-hop act to go platinum.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_10" role="doc-pagebreak" title="Insert_10"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_10_img1" src="../images/024_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(RAYMOND BOYD/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Ice Cube made a name for himself as a wordsmith for N.W.A before breaking with the group and collaborating with Public Enemy’s Bomb Squad for his revolutionary 1990 debut solo album, <i>AmeriKKKa’s Most Wanted</i>.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_10_img2" src="../images/025_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(TED SOQUI/CORBIS VIA GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">N.W.A’s “Fuck Tha Police” became a rallying anthem during the 1992 uprising following the acquittal of the police officers who brutally beat Rodney King.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_10_img3" src="../images/023_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(AL PEREIRA/MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">N.W.A (left to right: MC Ren, DJ Yella, Eazy-E, Dr. Dre) stirred outrage with law enforcement and shocked Middle America, while amplifying overlooked and marginalized voices across the country. The group’s 1991 album, <i>Efil4zaggin</i>, showed how deeply hip-hop penetrated communities when it topped the Billboard 200 after the advent of Nielsen SoundScan.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_11" role="doc-pagebreak" title="Insert_11"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_11_img1" src="../images/026_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(RAYMOND BOYD/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Luke Skyywalker (with mic) and his pioneering Southern hip-hop group, 2 Live Crew, pushed boundaries with their lyrics and performances. The Florida artists fought off far-reaching obscenity charges in federal appeals court.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_12" role="doc-pagebreak" title="Insert_12"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_12_img1" src="../images/027_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(RAYMOND BOYD/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">The Geto Boys’ Bushwick Bill performs at St. Louis Arena in 1991. The Houston group’s classic lineup consisted of Scarface, Willie D, and Bushwick Bill. The trio helped put Southern artists on the map through hits like “Mind Playing Tricks on Me.”</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_14" role="doc-pagebreak" title="Insert_14"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_14_img1" src="../images/029_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JEFF KRAVITZ/FILMMAGIC)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Death Row’s Suge Knight (right) recruited Tupac Shakur (left) to the record label while Shakur was incarcerated at Clinton Correctional Facility. The partnership aligned Shakur with Dr. Dre, one of hip-hop’s top producers, and deepened a feud with New York’s Bad Boy Records.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_14_img2" src="../images/028_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(AL PEREIRA/MICHAEL OCHS ARCHIVES/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Puff Daddy and the Notorious B.I.G. watch Dr. Dre’s performance at the 1995 Source Awards on a consequential evening that solidified hip-hop’s coastal rivalry.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_68">
					<img alt="" class="fill" id="page_Insert_14_img3" src="../images/030_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JOHNNY NUNEZ/WIREIMAGE)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Faith Newman (right), one of Def Jam’s earliest employees, had recently landed at Columbia Records when she scrambled to sign a young Queensbridge artist, Nasir Jones (left). The debut album, 1994’s <i class="char-i">Illmatic,</i> is lauded as one of the greatest of all time.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_14_img4" src="../images/031_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(MITCHELL GERBER/CORBIS/VCG VIA GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Jay-Z, shown here performing at New Jersey’s Continental Airlines Arena, released his debut, <i class="char-i">Reasonable Doubt</i>, in 1996. The album kickstarted the career of hip-hop’s first billionaire.</p>
				</figcaption>
			</figure>
			<span epub:type="pagebreak" id="page_Insert_15" role="doc-pagebreak" title="Insert_15"/>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_15_img1" src="../images/032_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(TAYLOR HILL/GETTY IMAGES)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Goodie Mob’s <i class="char-i">Soul Food</i> arrived mere months after the divisive 1995 Source Awards. Backed by Organized Noize’s stellar production, CeeLo, Big Gipp, Khujo, and T-Mo simultaneously defined and broadened Southern hip-hop music throughout their debut.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
					<img alt="" class="fill" id="page_Insert_15_img2" src="../images/033_Abra_9781984825131_ins_art_r1.jpg"/>
					<p class="figcopyright bold" role="doc-credit">(JOHN SHEARER/WIREIMAGE)</p>
				</div>
				<figcaption class="figcaption dynamic_box">
					<p class="para-illcap figcaption_para bold">Al Kapone (left) had established himself as an underground Memphis hip-hop legend before writing tracks that the actor Terrence Howard (right) performed in the 2005 film <i class="char-i">Hustle &amp; Flow</i>.</p>
				</figcaption>
			</figure>
			<figure class="figure figure_full_caption">
				<div class="width_100">
